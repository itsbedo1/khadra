<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خضرة | Khadra Fresh</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a4a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="خضرة">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --gd:#1a4a2e; --gm:#2d7a4f; --gl:#a8e6c1; --gp:#e8f7ee;
  --gold:#e8b84b; --cream:#fdf9f2;
  --txt:#1e2d23; --mut:#6b7f72;
  --sh:0 8px 40px rgba(26,74,46,.13); --shs:0 2px 12px rgba(26,74,46,.09);
  --r:18px; --rs:10px; --tr:all .3s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Cairo',sans-serif;background:var(--cream);color:var(--txt);min-height:100vh;overflow-x:hidden;max-width:100vw;}
html{overflow-x:hidden;}

/* LOADER */
#ld{position:fixed;inset:0;background:rgba(26,74,46,.88);z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
#ld.on{display:flex;} #ld .sp{font-size:3rem;animation:spin 1s linear infinite;} #ld p{color:#fff;font-weight:700;}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
#tst{position:fixed;bottom:82px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--gd);color:#fff;padding:11px 22px;border-radius:50px;font-size:.86rem;font-weight:700;box-shadow:var(--sh);opacity:0;transition:all .3s;z-index:8000;pointer-events:none;white-space:nowrap;max-width:92vw;text-overflow:ellipsis;overflow:hidden;}
#tst.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* TOPBAR */
.tb{position:fixed;top:0;right:0;left:0;z-index:1000;background:var(--gd);display:flex;align-items:center;justify-content:space-between;padding:10px 14px;}
.tbr{color:var(--gl);font-weight:900;font-size:1rem;}

/* VIEWS */
#app{margin-top:50px;}

/* HERO */
.hr{background:linear-gradient(135deg,var(--gd),var(--gm));padding:34px 18px 44px;text-align:center;}
.hb{display:inline-block;background:var(--gold);color:#111;border-radius:30px;padding:5px 15px;font-size:.78rem;font-weight:700;margin-bottom:13px;}
.hr h1{color:#fff;font-size:clamp(1.5rem,5vw,2.3rem);font-weight:900;line-height:1.25;margin-bottom:9px;}
.hr h1 span{color:var(--gl);} .hr p{color:rgba(255,255,255,.73);margin-bottom:20px;font-size:.9rem;}
.hs{display:flex;background:#fff;border-radius:50px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.2);max-width:420px;margin:0 auto;}
.hs input{flex:1;border:none;padding:12px 16px;font-family:'Cairo',sans-serif;font-size:.88rem;outline:none;}
.hs button{background:var(--gold);border:none;padding:12px 18px;color:#111;font-weight:700;cursor:pointer;}

/* SECTION */
.sc{padding:20px 13px;max-width:900px;margin:0 auto;} .sc-t{font-size:1.05rem;font-weight:900;margin-bottom:13px;}

/* CATS */
.cs{display:flex;gap:8px;overflow-x:auto;padding:0 13px 5px;scrollbar-width:none;}
.cs::-webkit-scrollbar{display:none;}
.cb{flex-shrink:0;background:#fff;border-radius:50px;padding:8px 14px;display:flex;align-items:center;gap:7px;cursor:pointer;transition:all .18s ease;border:1.5px solid #e0e0e0;}
.cb:active{transform:scale(.94);}
.cb.on{border-color:var(--gm);background:var(--gp);}
@media(hover:hover){.cb:hover{border-color:var(--gm);background:var(--gp);}}
.ci2{font-size:1.25rem;line-height:1;} .cn{font-size:.78rem;font-weight:700;white-space:nowrap;color:var(--txt);}
.cb.on .cn{color:var(--gd);}

/* PRODUCTS */
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(min-width:600px){.pg{grid-template-columns:repeat(auto-fill,minmax(165px,1fr));}}
.pc{background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--shs);transition:transform .15s ease,box-shadow .15s ease;position:relative;}
.pc:active{transform:scale(.97);}
@media(hover:hover){.pc:hover{transform:translateY(-3px);box-shadow:var(--sh);}}
.pi{height:110px;background:linear-gradient(135deg,var(--gp),var(--gl));display:flex;align-items:center;justify-content:center;font-size:2.6rem;}
.pin{padding:9px 10px;} .pn{font-size:.86rem;font-weight:700;line-height:1.3;margin-bottom:5px;}
.pp{font-size:.9rem;font-weight:900;color:var(--gm);}
.pf{display:flex;justify-content:space-between;align-items:center;padding:0 10px 10px;}
.qc{display:flex;align-items:center;gap:6px;}
.qb{width:30px;height:30px;border-radius:50%;border:1px solid var(--gp);background:var(--gp);color:var(--gd);font-size:1.1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s ease;}
.qb:active{transform:scale(.84);background:var(--gm);color:#fff;border-color:var(--gm);}
@media(hover:hover){.qb:hover{background:var(--gm);color:#fff;}}
.qn{font-weight:700;min-width:18px;text-align:center;font-size:.9rem;}
.ba{background:var(--gm);color:#fff;border:none;border-radius:50px;padding:7px 14px;font-size:.78rem;font-family:'Cairo',sans-serif;font-weight:700;cursor:pointer;transition:all .12s ease;min-width:38px;}
.ba:active{transform:scale(.9);}
@media(hover:hover){.ba:hover{background:var(--gd);}}
.ba.add{background:var(--gold);color:#111;}
.pempty{padding:36px;text-align:center;color:var(--mut);grid-column:1/-1;}

/* MICRO-INTERACTIONS */
@keyframes popIn{0%{transform:scale(1)}40%{transform:scale(1.16)}70%{transform:scale(.95)}100%{transform:scale(1)}}
.pop-anim{animation:popIn .28s cubic-bezier(.4,0,.2,1);}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-44px) scale(.8)}}
.float-label{position:absolute;top:28%;right:50%;font-size:14px;font-weight:900;color:var(--gm);pointer-events:none;animation:floatUp .65s ease forwards;z-index:20;white-space:nowrap;}

/* CART FAB */
.cf{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:500;background:var(--gd);color:#fff;border-radius:50px;padding:13px 22px;display:none;align-items:center;gap:10px;box-shadow:0 8px 32px rgba(26,74,46,.45);cursor:pointer;border:none;font-family:'Cairo',sans-serif;transition:transform .15s ease,box-shadow .15s ease;min-width:220px;justify-content:space-between;}
.cf:active{transform:translateX(-50%) scale(.96);}
@media(hover:hover){.cf:hover{box-shadow:0 12px 40px rgba(26,74,46,.55);}}
@media(max-width:600px){.cf{bottom:18px;left:14px;right:14px;transform:none;width:calc(100% - 28px);}
.cf:active{transform:scale(.97);}}
.cc{background:var(--gold);color:#111;border-radius:50%;width:24px;height:24px;font-size:.74rem;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cf-info{flex:1;display:flex;flex-direction:column;}
.cf-items{font-size:.68rem;color:var(--gl);font-weight:500;}
.cf-total{font-size:.96rem;font-weight:900;}

/* OVERLAY + CART */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:800;opacity:0;pointer-events:none;transition:opacity .3s;}
.ov.on{opacity:1;pointer-events:all;}
.cp{position:fixed;top:0;right:0;bottom:0;width:min(360px,100vw);background:#fff;z-index:900;transform:translateX(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);box-shadow:-8px 0 36px rgba(0,0,0,.14);display:flex;flex-direction:column;}
.cp.on{transform:translateX(0);}
.ch{background:var(--gd);color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;}
.ch h3{font-size:.96rem;font-weight:900;}
.cclose{background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.citems{flex:1;overflow-y:auto;padding:13px;}
.cit{display:flex;gap:9px;align-items:center;background:var(--gp);border-radius:var(--rs);padding:8px;margin-bottom:8px;}
.cie{font-size:1.7rem;min-width:34px;text-align:center;}
.cii{flex:1;} .cin{font-weight:700;font-size:.84rem;} .cip{color:var(--gm);font-weight:900;font-size:.84rem;}
.cfoot{padding:13px;border-top:2px solid var(--gp);}
.crow{display:flex;justify-content:space-between;margin-bottom:5px;font-size:.84rem;color:var(--mut);}
.crow.tot{font-weight:900;font-size:.93rem;color:var(--txt);border-top:1px solid var(--gp);padding-top:6px;margin-top:5px;}
.bco{width:100%;background:var(--gm);color:#fff;border:none;border-radius:50px;padding:13px;font-size:.93rem;font-weight:900;font-family:'Cairo',sans-serif;cursor:pointer;transition:var(--tr);margin-top:9px;}
.bco:hover{background:var(--gd);}
.cemp{text-align:center;padding:44px 18px;color:var(--mut);}

/* MODAL (checkout) */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;padding:14px;}
.mbg.on{opacity:1;pointer-events:all;}
.mb{background:#fff;border-radius:20px;width:min(460px,95vw);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.28);transform:translateY(18px);transition:transform .3s;}
.mbg.on .mb{transform:translateY(0);}
.mh{background:var(--gd);color:#fff;padding:15px 17px;border-radius:20px 20px 0 0;display:flex;justify-content:space-between;align-items:center;}
.mh h3{font-size:.96rem;font-weight:900;}
.mx{background:rgba(255,255,255,.15);border:none;color:#fff;width:29px;height:29px;border-radius:50%;font-size:.96rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mbd{flex:1;overflow-y:auto;padding:16px;}
.mft{padding:12px 15px;border-top:2px solid var(--gp);display:flex;gap:8px;justify-content:flex-end;}

/* FORM */
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:11px;}
.fg label{font-size:.78rem;font-weight:700;color:var(--gd);}
.fg input,.fg textarea{border:1.5px solid #dde6e1;border-radius:var(--rs);padding:10px 12px;font-family:'Cairo',sans-serif;font-size:.88rem;outline:none;transition:var(--tr);width:100%;resize:none;}
.fg input:focus,.fg textarea:focus{border-color:var(--gm);}
.bsub{background:var(--gm);color:#fff;border:none;border-radius:50px;padding:12px 26px;font-size:.9rem;font-family:'Cairo',sans-serif;font-weight:900;cursor:pointer;transition:var(--tr);width:100%;}
.bsub:hover{background:var(--gd);}
.bcancel{background:none;border:none;color:var(--mut);font-family:'Cairo',sans-serif;font-size:.86rem;font-weight:700;cursor:pointer;padding:12px;}
#orderCopyBox{display:none;margin-top:10px;}
#orderCopyBox textarea{height:130px;font-size:.78rem;}

</style>
</head>
<body>

<div id="ld"><div class="sp">🌿</div><p id="ldm">جاري التحميل...</p></div>
<div id="tst"></div>

<!-- TOPBAR -->
<div class="tb">
  <div class="tbr">🌿 خضرة · Khadra</div>
</div>

<div id="app">
  <div class="hr">
    <div class="hb">🚀 توصيل سريع</div>
    <h1>خضروات <span>طازجة</span><br>لباب بيتك</h1>
    <p>اختر منتجاتك وأرسل طلبك بضغطة زر</p>
    <div class="hs"><input type="text" id="srch" placeholder="ابحث عن منتج..." oninput="drawProds()"><button onclick="drawProds()">🔍</button></div>
  </div>

  <div class="sc"><div class="sc-t">الأقسام</div><div class="cs" id="catsEl"></div></div>
  <div class="sc"><div class="sc-t">المنتجات</div><div class="pg" id="prodsEl"></div></div>
</div>

<!-- CART FAB -->
<button class="cf" id="cfab" onclick="openCart()">
  <div class="cc" id="ccnt">0</div>
  <div class="cf-info">
    <span class="cf-items" id="cfItems">عناصر في السلة</span>
    <span class="cf-total" id="ctot">0 IQD</span>
  </div>
  <span style="font-size:1.1rem;">←</span>
</button>

<!-- CART PANEL -->
<div class="ov" id="ov" onclick="closeCart()"></div>
<div class="cp" id="cpanel">
  <div class="ch"><h3>🛒 سلة التسوق</h3><button class="cclose" onclick="closeCart()">✕</button></div>
  <div class="citems" id="citems"></div>
  <div class="cfoot" id="cfoot" style="display:none">
    <div class="crow"><span>المجموع الفرعي</span><span id="csub">0</span></div>
    <div class="crow"><span>رسوم التوصيل</span><span id="cdelfee">0</span></div>
    <div class="crow tot"><span>الإجمالي</span><span id="cgrand">0</span></div>
    <button class="bco" onclick="openCheckout()">✅ تأكيد الطلب</button>
  </div>
</div>

<!-- CHECKOUT MODAL -->
<div class="mbg" id="checkoutModal" onclick="if(event.target===this)closeCheckout()">
  <div class="mb">
    <div class="mh"><h3>📦 تأكيد الطلب</h3><button class="mx" onclick="closeCheckout()">✕</button></div>
    <div class="mbd">
      <div class="fg"><label>الاسم</label><input type="text" id="ordName" placeholder="اسمك"></div>
      <div class="fg"><label>رقم الهاتف</label><input type="tel" id="ordPhone" placeholder="07xxxxxxxxx"></div>
      <div class="fg"><label>العنوان</label><textarea id="ordAddress" rows="3" placeholder="المحافظة، المنطقة، أقرب نقطة دالة..."></textarea></div>
      <div class="fg"><label>ملاحظة (اختياري)</label><input type="text" id="ordNote" placeholder="مثال: اتصل قبل الوصول"></div>
      <button class="bsub" onclick="submitOrder()" id="ordSubmitBtn">🚀 إرسال الطلب على تيليجرام</button>
      <div id="orderCopyBox">
        <div style="font-size:.78rem;color:var(--mut);margin-bottom:6px">⚠️ تعذر الإرسال التلقائي — انسخ الطلب وأرسله يدويًا:</div>
        <textarea readonly id="orderCopyText"></textarea>
        <button class="bsub" style="margin-top:8px;background:var(--gold);color:#111" onclick="copyOrderText()">📋 نسخ نص الطلب</button>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════ إعدادات — عدّلها مرة واحدة فقط ═══════════

// قاعدة بيانات Supabase (نفس القاعدة الموجودة مسبقًا في المشروع)
const URL2 = 'https://teospyoryqqgieqbbqtt.supabase.co';
const KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlb3NweW9yeXFxZ2llcWJicXR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3OTYxNDIsImV4cCI6MjA5MTM3MjE0Mn0.NMf-fhlUJh-SFCEuqMzCTx9DYj40u6U7acECZu09Oko';
const HD = {'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY,'Prefer':'return=representation'};

// بوت تيليجرام — استبدل القيمتين بالتوكن والـ chat id الخاصين بمحلك
const TELEGRAM_BOT_TOKEN = 'PASTE_YOUR_BOT_TOKEN_HERE';
const TELEGRAM_CHAT_ID   = 'PASTE_YOUR_CHAT_ID_HERE';

// رسوم التوصيل الثابتة (IQD)
const DELIVERY_FEE = 2500;

// ═══════════ نهاية الإعدادات ═══════════

async function sGet(t,q=''){const r=await fetch(URL2+'/rest/v1/'+t+'?'+q,{headers:HD});if(!r.ok)throw await r.text();return r.json();}

function ld(show,msg='جاري التحميل...'){document.getElementById('ldm').textContent=msg;document.getElementById('ld').classList.toggle('on',show);}
let tT; function toast(m){const e=document.getElementById('tst');e.textContent=m;e.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>e.classList.remove('on'),3200);}

// ═══════════ بيانات تجريبية تظهر فقط إذا تعذر الاتصال بقاعدة البيانات ═══════════
const DEMO_PRODUCTS=[
  {id:1,ar:'طماطم',en:'Tomato',price:2000,stock:50,emoji:'🍅',cat:'vegetables'},
  {id:2,ar:'خيار',en:'Cucumber',price:1500,stock:50,emoji:'🥒',cat:'vegetables'},
  {id:3,ar:'بطاطا',en:'Potato',price:1000,stock:50,emoji:'🥔',cat:'vegetables'},
  {id:4,ar:'بصل',en:'Onion',price:1000,stock:50,emoji:'🧅',cat:'vegetables'},
  {id:5,ar:'جزر',en:'Carrot',price:1200,stock:50,emoji:'🥕',cat:'vegetables'},
  {id:6,ar:'تفاح',en:'Apple',price:3000,stock:50,emoji:'🍎',cat:'fruits'},
  {id:7,ar:'موز',en:'Banana',price:2500,stock:50,emoji:'🍌',cat:'fruits'},
  {id:8,ar:'برتقال',en:'Orange',price:2000,stock:50,emoji:'🍊',cat:'citrus'},
  {id:9,ar:'ليمون',en:'Lemon',price:1500,stock:50,emoji:'🍋',cat:'citrus'},
  {id:10,ar:'نعناع',en:'Mint',price:500,stock:50,emoji:'🌿',cat:'herbs'},
];

const CATS=[{id:'all',ar:'الكل',ic:'🌿'},{id:'vegetables',ar:'خضروات',ic:'🥦'},{id:'fruits',ar:'فواكه',ic:'🍎'},{id:'herbs',ar:'أعشاب',ic:'🌿'},{id:'citrus',ar:'حمضيات',ic:'🍋'}];

let prods=[],cart={},actCat='all';
function rP(r){return{id:r.id,ar:r.name_ar,en:r.name_en,price:r.price,stock:r.stock,emoji:r.emoji,cat:r.category};}

// ═══════════ تحميل المنتجات ═══════════
async function loadProducts(){
  ld(true,'جاري تحميل المنتجات...');
  try{
    const p=await sGet('khadra_products','order=id');
    prods=p.map(rP);
  }catch(e){
    console.warn('تعذر تحميل المنتجات من قاعدة البيانات:',e);
    prods=DEMO_PRODUCTS.map(p=>({...p}));
    toast('⚠️ تعذر الاتصال بقاعدة البيانات — عرض بيانات تجريبية');
  }
  ld(false);
  drawCats();drawProds();
}

// ═══════════ الأقسام والمنتجات ═══════════
function drawCats(){
  document.getElementById('catsEl').innerHTML=CATS.map(c=>`<div class="cb ${actCat===c.id?'on':''}" onclick="setCat('${c.id}')"><div class="ci2">${c.ic}</div><div class="cn">${c.ar}</div></div>`).join('');
}
function setCat(id){actCat=id;drawCats();drawProds();}

function drawProds(){
  const q=(document.getElementById('srch')?.value||'').trim().toLowerCase();
  const list=prods.filter(p=>(actCat==='all'||p.cat===actCat)&&(!q||p.ar.includes(q)||(p.en||'').toLowerCase().includes(q)));
  const g=document.getElementById('prodsEl');
  if(!list.length){g.innerHTML='<div class="pempty">لا توجد منتجات 🔍</div>';return;}
  g.innerHTML=list.map(p=>{
    const ic=cart[p.id]||0;
    return `<div class="pc">
      <div class="pi">${p.emoji||'🥬'}</div>
      <div class="pin"><div class="pn">${p.ar}</div><div class="pp">${(p.price||0).toLocaleString()} IQD</div></div>
      <div class="pf">
        ${ic?`<div class="qc"><button class="qb" onclick="chgQ(${p.id},-1)">−</button><span class="qn">${ic}</span><button class="qb" onclick="chgQ(${p.id},1)">+</button></div>`:'<div></div>'}
        <button class="ba ${ic?'add':''}" onclick="addCart(${p.id},this)">${ic?'✓ أضيف':'+ أضف'}</button>
      </div>
    </div>`;
  }).join('');
}

// ═══════════ السلة ═══════════
function addCart(id, el) {
  cart[id] = (cart[id]||0) + 1;
  updateCartUI();
  drawProds();
  if (el) {
    const card = el.closest('.pc');
    if (card) {
      card.classList.remove('pop-anim');
      void card.offsetWidth;
      card.classList.add('pop-anim');
      setTimeout(() => card.classList.remove('pop-anim'), 300);
      const fl = document.createElement('div');
      fl.className = 'float-label';
      fl.textContent = '+1';
      card.appendChild(fl);
      setTimeout(() => fl.remove(), 650);
    }
  }
}
function chgQ(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];updateCartUI();drawProds();drawCart();}
function updateCartUI(){
  const tot=cartSubtotal();
  const cnt=Object.values(cart).reduce((a,b)=>a+b,0);
  document.getElementById('ccnt').textContent=cnt;
  document.getElementById('ctot').textContent=tot.toLocaleString()+' IQD';
  document.getElementById('cfab').style.display=cnt>0?'flex':'none';
  const el=document.getElementById('cfItems');
  if(el) el.textContent=cnt+' '+(cnt===1?'منتج':'منتجات')+' في السلة';
  const fab=document.getElementById('cfab');
  if(fab && cnt>0){
    fab.classList.remove('pop-anim');
    void fab.offsetWidth;
    fab.classList.add('pop-anim');
    setTimeout(()=>fab.classList.remove('pop-anim'),300);
  }
}
function cartSubtotal(){return Object.entries(cart).reduce((s,[id,q])=>{const p=prods.find(x=>x.id==id);return s+(p?p.price*q:0);},0);}
function openCart(){document.getElementById('cpanel').classList.add('on');document.getElementById('ov').classList.add('on');drawCart();}
function closeCart(){document.getElementById('cpanel').classList.remove('on');document.getElementById('ov').classList.remove('on');}
function drawCart(){
  const items=document.getElementById('citems'),foot=document.getElementById('cfoot');
  const en=Object.entries(cart).filter(([,q])=>q>0);
  if(!en.length){items.innerHTML='<div class="cemp">🛒<br>السلة فارغة</div>';foot.style.display='none';return;}
  foot.style.display='block';
  items.innerHTML=en.map(([id,qty])=>{const p=prods.find(x=>x.id==id);if(!p)return '';return `<div class="cit"><div class="cie">${p.emoji||'🥬'}</div><div class="cii"><div class="cin">${p.ar}</div><div class="cip">${(p.price*qty).toLocaleString()} IQD</div></div><div class="qc"><button class="qb" onclick="chgQ(${p.id},-1)">−</button><span class="qn">${qty}</span><button class="qb" onclick="chgQ(${p.id},1)">+</button></div></div>`;}).join('');
  const sub=cartSubtotal();
  document.getElementById('csub').textContent=sub.toLocaleString()+' IQD';
  document.getElementById('cdelfee').textContent=DELIVERY_FEE.toLocaleString()+' IQD';
  document.getElementById('cgrand').textContent=(sub+DELIVERY_FEE).toLocaleString()+' IQD';
}

// ═══════════ الطلب — إرسال إلى تيليجرام ═══════════
function openCheckout(){
  const en=Object.entries(cart).filter(([,q])=>q>0);
  if(!en.length){toast('⚠️ السلة فارغة');return;}
  document.getElementById('orderCopyBox').style.display='none';
  document.getElementById('ordSubmitBtn').style.display='block';
  document.getElementById('checkoutModal').classList.add('on');
}
function closeCheckout(){document.getElementById('checkoutModal').classList.remove('on');}

function buildOrderText(name,phone,address,note){
  const en=Object.entries(cart).filter(([,q])=>q>0);
  const sub=cartSubtotal();
  const total=sub+DELIVERY_FEE;
  const ref='#'+Date.now().toString().slice(-6);
  const lines=en.map(([id,q])=>{const p=prods.find(x=>x.id==id);return p?`• ${p.ar} × ${q} = ${(p.price*q).toLocaleString()} IQD`:'';}).filter(Boolean).join('\n');
  return `🌿 طلب جديد من خضرة ${ref}\n\n📦 المنتجات:\n${lines}\n\n💵 المجموع الفرعي: ${sub.toLocaleString()} IQD\n🚚 التوصيل: ${DELIVERY_FEE.toLocaleString()} IQD\n💰 الإجمالي: ${total.toLocaleString()} IQD\n\n👤 الاسم: ${name}\n📞 الهاتف: ${phone}\n📍 العنوان: ${address}${note?`\n📝 ملاحظة: ${note}`:''}`;
}

async function submitOrder(){
  const name=(document.getElementById('ordName').value||'').trim();
  const phone=(document.getElementById('ordPhone').value||'').trim();
  const address=(document.getElementById('ordAddress').value||'').trim();
  const note=(document.getElementById('ordNote').value||'').trim();
  if(!name){toast('⚠️ أدخل الاسم');return;}
  if(!phone){toast('⚠️ أدخل رقم الهاتف');return;}
  if(!address){toast('⚠️ أدخل العنوان');return;}

  const text=buildOrderText(name,phone,address,note);
  ld(true,'جاري إرسال الطلب...');
  try{
    if(TELEGRAM_BOT_TOKEN==='PASTE_YOUR_BOT_TOKEN_HERE'||TELEGRAM_CHAT_ID==='PASTE_YOUR_CHAT_ID_HERE'){
      throw new Error('لم يتم إعداد بوت تيليجرام بعد');
    }
    const r=await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:TELEGRAM_CHAT_ID,text})
    });
    if(!r.ok) throw new Error(await r.text());
    ld(false);
    cart={};updateCartUI();closeCart();closeCheckout();drawProds();
    toast('🎉 تم إرسال طلبك بنجاح! سنتواصل معك قريبًا');
    document.getElementById('ordName').value='';document.getElementById('ordPhone').value='';
    document.getElementById('ordAddress').value='';document.getElementById('ordNote').value='';
  }catch(e){
    ld(false);
    console.warn('فشل إرسال الطلب لتيليجرام:',e);
    document.getElementById('orderCopyText').value=text;
    document.getElementById('orderCopyBox').style.display='block';
    document.getElementById('ordSubmitBtn').style.display='none';
    toast('⚠️ تعذر الإرسال التلقائي — انسخ الطلب وأرسله يدويًا');
  }
}
function copyOrderText(){
  const t=document.getElementById('orderCopyText');
  t.select();
  navigator.clipboard?.writeText(t.value).then(()=>toast('📋 تم نسخ الطلب')).catch(()=>document.execCommand('copy'));
}

// ═══════════ التشغيل ═══════════
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
loadProducts();
updateCartUI();
</script>
